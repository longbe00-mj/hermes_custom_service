public_url: http://localhost:8088
database_url: postgresql+psycopg://hermes@db/hermes
smtp_host: mail
smtp_port: 1025
smtp_from: hermes@localhost
secure_cookies: false
admin_otp_required: false
access_seconds: 900
refresh_seconds: 604800
manager_url: http://manager:8001
max_active_runtimes: 5
runtime_image: hermes-custom-runtime:0.1.0
runtime_memory: 4g
runtime_cpus: 2
daily_token_limit: 1000000
max_model_parallel: 2
allowed_models:
  - gpt-4.1-mini
default_model: gpt-4.1-mini

# OAuth clients must be registered for this service and permitted for its deployment.
provider_oauth:
  openai:
    client_id: dynamic_agent_client
    redirect_uri: http://127.0.0.1:8088/auth/callback
    scopes: openid profile email offline_access resource.invoke chatgpt.tokens.use.direct
  anthropic:
    client_id: ''
    redirect_uri: http://localhost:8088/auth/callback
    scopes: user:profile user:inference
    authorization_url: https://claude.ai/oauth/authorize
    token_url: https://platform.claude.com/v1/oauth/token

oauth_max_parallel: 1
