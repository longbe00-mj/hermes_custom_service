name: Local Compose contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sh scripts/setup.sh
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T platform sh scripts/run_tests.sh
      - run: docker compose --profile tools run --rm --entrypoint python ops -m scripts.smoke
      - run: docker compose --profile tools run --rm --entrypoint python ops -m scripts.storage_smoke
      - if: always()
        run: docker compose logs --tail 60 platform manager migrate
      - if: always()
        run: docker compose exec -T platform python -m service.cli drain || true
      - if: always()
        run: docker compose down
